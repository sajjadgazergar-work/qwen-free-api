services:
  conduit:
    build: .
    ports:
      - "${CONDUIT_BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      DEEPSEEK_BASE_URL: http://deepseek:22217
      GEMINI_BASE_URL: http://gemini:8000
      GEMINI_MANAGEMENT_KEY: ${GEMINI_MANAGEMENT_KEY:-conduit-internal-gemini-key}
      CONDUIT_DATA_DIR: /app/data
    volumes:
      - ./data/qwen:/app/data
    depends_on:
      deepseek:
        condition: service_started
      gemini:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  deepseek:
    image: ghcr.io/niyueee/ds-free-api:latest
    volumes:
      - ./data/deepseek:/app/data
      - ./config:/app/config
    environment:
      DS_DATA_DIR: /app/data
      DS_CONFIG_PATH: /app/config/deepseek.toml
      RUST_LOG: info
    expose:
      - "22217"
    # The upstream minimal image intentionally contains no wget/curl. Do not
    # attach a healthcheck that can only report false negatives; Conduit probes
    # the provider's /health endpoint directly and exposes it via /health/ready.
    restart: unless-stopped

  gemini:
    build:
      context: ./providers/gemini
    volumes:
      - ./data/gemini:/app/data
      - ./data/gemini-cache:/app/cache
      - ./config:/app/config
    environment:
      CONFIG_PATH: /app/config/gemini.yaml
      GEMINI_COOKIE_PATH: /app/cache
      CONDUIT_MANAGEMENT_KEY: ${GEMINI_MANAGEMENT_KEY:-conduit-internal-gemini-key}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
